name: Generate and publish Spain routing data
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Data release tag: routing-spain-YYYY-MM-DD'
        required: true
        default: routing-spain-2026-11-17
permissions:
  contents: write
concurrency:
  group: regional-data-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag before generating or changing metadata
        run: python3 tools/routing/check-data-release.py --tag "$DATA_TAG"
      - name: Generate and validate nineteen regions
        run: python3 tools/routing/build-spain-parallel.py
      - name: Validate catalogue and commit data metadata
        run: |
          python3 tools/routing/test_spain_catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routing-data/spain
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Spain routing data for $DATA_TAG"
            git push origin HEAD:main
          fi
      - name: Upload verified packages and publish release
        run: python3 tools/routing/publish-spain.py --tag "$DATA_TAG"
